services:
  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://reachinbox-frontend-9qww.onrender.com
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_MS_BETWEEN_SENDS
        value: 1000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: reachinbox-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reachinbox-backend-vvu3.onrender.com/api

  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow backend service access

# ── Managed PostgreSQL Database ─────────────────────────────────────────────
databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox
    user: reachinbox_user
