services:
  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # Enter your Redis URL (e.g., from Upstash Redis or Render Redis)
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.onrender.com # Update once frontend is provisioned
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_MS_BETWEEN_SENDS
        value: 1000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: reachinbox-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reachinbox-backend.onrender.com/api # Update once backend is provisioned

# ── Managed PostgreSQL Database ─────────────────────────────────────────────
databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox
    user: reachinbox_user


